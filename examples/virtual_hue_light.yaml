# Board: Espressif ESP32-C6-DevKitM-1 (Espressif)
# Definition: definitions/boards/esp32-c6-devkitm-1/manifest.yaml

esphome:
  name: 111-zigbee-light-test
  friendly_name: 111_zigbee-light-test

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf


logger:
  level: DEBUG

external_components:
  - source: github://luar123/zigbee_esphome
    components: [zigbee]

zigbee:
  id: zb
  name: "Jindacek Zigbee Light"
  manufacturer: "Jindacek"
  router: true

  endpoints:
    - num: 11
      device_type: DIMMABLE_LIGHT
      clusters:
        - id: ON_OFF
          attributes:
            - attribute_id: 0
              type: bool
              on_value:
                then:
                  - light.control:
                      id: virtual_light
                      state: !lambda "return (bool)x;"

        - id: LEVEL
          attributes:
            - attribute_id: 0
              type: UINT8
              on_value:
                then:
                  - light.control:
                      id: virtual_light
                      brightness: !lambda "return ((float)x)/254.0f;"

output:
  - platform: template
    id: virtual_output
    type: float
    write_action:
      - lambda: |-
          ESP_LOGI("zigbee_light", "Brightness: %.1f %%", state * 100.0f);

light:
  - platform: monochromatic
    id: virtual_light
    name: "Virtual Dimmable Light"
    output: virtual_output
    gamma_correct: 1.0
    default_transition_length: 0s
